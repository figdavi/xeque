services:
  postgres:
    image: postgres:17
    container_name: xeque-postgres
    restart: unless-stopped
    environment:
      # Credenciais apenas para desenvolvimento local
      POSTGRES_USER: ${POSTGRES_USER:-xeque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xeque}
      POSTGRES_DB: ${POSTGRES_DB:-xeque}
    ports:
      - '5432:5432'
    volumes:
      - xeque-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xeque-pgdata: